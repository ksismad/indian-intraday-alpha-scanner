services:
  - type: web
    name: indian-intraday-alpha-scanner
    runtime: docker
    plan: 2c-4g
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: scanner-runtime
      mountPath: /app/runtime
      sizeGB: 1
    envVars:
      - key: RESULTS_FILE
        value: /app/runtime/results.json
      - key: STATE_FILE
        value: /app/runtime/scanner_state.json
      - key: RUN_FOREVER
        value: "1"
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: UNIVERSE_BATCH_SIZE
        value: "60"
      - key: DEEP_LIMIT
        value: "15"
      - key: WORKERS
        value: "16"
      - key: MIN_ATR_PCT
        value: "1.8"
      - key: MIN_VOL_SHOCK
        value: "1.5"
      - key: MIN_RR
        value: "2.0"
      - key: NEWS_GATE
        value: "0"
      - key: START_WORKER
        value: "1"
      - key: RESULTS_STALE_SECONDS
        value: "180"
